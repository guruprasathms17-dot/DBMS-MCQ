        <div class="options">
            ${item.options.map((opt, i) => `
                <div class="option">${String.fromCharCode(97 + i)}) ${opt}</div>
            `).join('')}
        </div>
        <div class="answer" id="ans-${index}">
            <strong>Answer:</strong> ${item.ans}
        </div>
        <button style="margin: 10px 0 0 44px; padding: 6px 14px; font-size: 0.85rem;" 
                onclick="toggleAnswer(${index})">Show Answer</button>
    `;
    container.appendChild(div);
});

function toggleAnswer(index) {
    const ans = document.getElementById(`ans-${index}`);
    ans.classList.toggle('show');
}

function showAllAnswers() {
    document.querySelectorAll('.answer').forEach(el => el.classList.add('show'));
}

function hideAllAnswers() {
    document.querySelectorAll('.answer').forEach(el => el.classList.remove('show'));
}
</script>
</body>
</html>
